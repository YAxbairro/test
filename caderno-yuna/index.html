<title>Caderno da Yuna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: a toddler's notebook — big candy-coloured cards on a blue ruled desk; the activity screen is one white sheet plus a chunky crayon-box tool rail. */
:root {
  --desk: #E6EEFF;
  --desk-line: #D3DEFB;
  --ink: #2B2A4C;
  --ink-soft: #66658F;
  --panel: #FFFFFF;
  --panel-edge: #D6DCF4;
  --sheet: #FFFFFF;
  --pink: #FF5D8F;
  --sun: #FFC23D;
  --mint: #23C59A;
  --sky: #3E95FF;
  --grape: #8B5CF6;
  --tang: #FF8A3D;
  --press: rgba(43, 42, 76, .16);
  --veil: rgba(30, 28, 70, .45);
  --f-display: 'Fredoka', 'Arial Rounded MT Bold', 'Trebuchet MS', system-ui, sans-serif;
  --f-body: 'Nunito', 'Trebuchet MS', system-ui, sans-serif;
  --r-lg: 28px;
  --r-md: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #17183A; --desk-line: #23255A; --ink: #F4F2FF; --ink-soft: #ABA8DA;
    --panel: #25275A; --panel-edge: #34377A; --press: rgba(0, 0, 0, .4); --veil: rgba(5, 5, 25, .65);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #17183A; --desk-line: #23255A; --ink: #F4F2FF; --ink-soft: #ABA8DA;
  --panel: #25275A; --panel-edge: #34377A; --press: rgba(0, 0, 0, .4); --veil: rgba(5, 5, 25, .65);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--desk);
  background-image: linear-gradient(var(--desk-line) 2px, transparent 2px);
  background-size: 100% 38px;
  color: var(--ink);
  font-family: var(--f-body);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
.screen { position: fixed; inset: 0; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

/* ---------- home ---------- */
#home { overflow-y: auto; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
.home-wrap { max-width: 1100px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 40px; display: flex; flex-direction: column; gap: 26px; }
.hero { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.logo { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 8vw, 84px); line-height: 1; letter-spacing: .01em; text-wrap: balance; }
.logo span { display: inline-block; animation: bob 3.2s ease-in-out infinite; }
.logo .sp { width: .3em; }
.tag { margin: 0; font-size: clamp(17px, 2.4vw, 22px); color: var(--ink-soft); font-weight: 800; }
@keyframes bob { 0%,100% { transform: translateY(0) rotate(var(--rot, 0deg)); } 50% { transform: translateY(-6px) rotate(var(--rot, 0deg)); } }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 18px; }
.card {
  display: flex; flex-direction: column; text-align: left; border-radius: var(--r-lg); overflow: hidden;
  background: var(--panel); box-shadow: 0 7px 0 var(--press); transition: transform .12s ease, box-shadow .12s ease;
}
.card:active { transform: translateY(5px) scale(.98); box-shadow: 0 2px 0 var(--press); }
.card .art { background: var(--c); height: 132px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.card .art svg { height: 108px; width: auto; max-width: 88%; display: block; }
.card .lbl { padding: 12px 16px 14px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.card .lbl b { font-family: var(--f-display); font-weight: 600; font-size: 25px; }
.card .lbl small { font-weight: 800; color: var(--ink-soft); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.parents { color: var(--ink-soft); font-size: 15px; line-height: 1.5; text-align: center; max-width: 62ch; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.pill { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px; background: var(--panel); box-shadow: 0 4px 0 var(--press); font-weight: 800; }

/* ---------- activity ---------- */
#act { display: flex; flex-direction: column; touch-action: none; }
.bar { display: flex; align-items: center; gap: 8px; padding: 10px 14px 6px; }
.ib {
  width: 56px; height: 56px; flex: none; border-radius: 18px; background: var(--panel); box-shadow: 0 5px 0 var(--press);
  font-size: 28px; display: grid; place-items: center; transition: transform .1s;
}
.ib:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--press); }
.ib.txt { font-family: var(--f-display); font-weight: 600; font-size: 24px; }
.titlebox {
  flex: 1 1 auto; min-width: 0; height: 56px; border-radius: 18px; background: var(--panel); box-shadow: 0 5px 0 var(--press);
  display: flex; align-items: center; justify-content: center; gap: 12px; padding: 0 14px; overflow: hidden;
}
.titlebox .g { font-family: var(--f-display); font-weight: 700; font-size: 40px; line-height: 1; color: var(--pink); }
.titlebox .w { font-family: var(--f-display); font-weight: 600; font-size: 24px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ib.pulse { animation: pulse 1s ease-in-out infinite; background: var(--sun); color: #2B2A4C; }
@keyframes pulse { 50% { transform: scale(1.12); } }

#countRow { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; padding: 4px 14px 2px; }
.cnt { position: relative; font-size: 36px; width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; background: var(--panel); box-shadow: 0 4px 0 var(--press); }
.cnt.on { background: var(--sun); animation: hop .35s ease; }
.cnt i { position: absolute; right: -4px; top: -6px; font-style: normal; font-family: var(--f-display); font-weight: 700; font-size: 17px; background: var(--pink); color: #fff; border-radius: 99px; min-width: 24px; height: 24px; display: grid; place-items: center; padding: 0 5px; }
.cnt.zero { width: auto; padding: 0 16px; font-size: 22px; font-family: var(--f-display); font-weight: 600; gap: 8px; display: flex; align-items: center; }
@keyframes hop { 40% { transform: translateY(-10px) scale(1.1); } }

.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; padding: 8px 14px 14px; }
#stage { position: relative; min-width: 0; min-height: 0; }
#sheet {
  position: absolute; border-radius: 22px; overflow: hidden; background: var(--sheet);
  box-shadow: 0 8px 0 var(--press), 0 0 0 3px var(--panel-edge); touch-action: none;
}
#sheet canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#cG, #cP, #cL { pointer-events: none; }
#prog { position: absolute; left: 18px; right: 18px; bottom: 14px; height: 14px; border-radius: 99px; background: rgba(139, 92, 246, .14); overflow: hidden; pointer-events: none; }
#prog i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #FF5D8F, #FFC23D, #23C59A, #3E95FF, #8B5CF6); transition: width .2s; }
#reveal { position: absolute; top: 14px; right: 18px; font-size: 84px; line-height: 1; pointer-events: none; animation: popin .6s cubic-bezier(.3, 1.6, .5, 1); }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#flash.go { animation: flash .5s ease; }
@keyframes flash { 10% { opacity: .9; } 100% { opacity: 0; } }
@keyframes popin { from { transform: scale(0) rotate(-30deg); } to { transform: scale(1) rotate(0); } }

#tools { width: 176px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding: 12px; border-radius: 24px; background: var(--panel); box-shadow: 0 6px 0 var(--press); touch-action: pan-y; }
.swatches { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; justify-items: center; }
.sw { width: 42px; height: 42px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), 0 0 0 2px rgba(43, 42, 76, .12); transition: transform .12s; }
.sw.rainbow { background: conic-gradient(#FF4D4D, #FFB020, #FFE14D, #4CD964, #3E95FF, #8B5CF6, #FF4D9A, #FF4D4D); }
.sw.sel { transform: scale(1.22); box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .18), 0 0 0 4px var(--panel), 0 0 0 7px var(--ink); }
.sizes { display: flex; justify-content: space-around; align-items: center; padding: 4px 0; border-block: 2px dashed var(--panel-edge); }
.sz { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
.sz i { display: block; border-radius: 50%; background: var(--ink); }
.sz.sel { background: var(--desk); box-shadow: inset 0 0 0 3px var(--ink); }
.toolbtns { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.tb { height: 62px; border-radius: 16px; background: var(--desk); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 26px; line-height: 1; transition: transform .1s; }
.tb small { font-size: 11px; font-weight: 800; color: var(--ink-soft); letter-spacing: .02em; }
.tb.sel { background: var(--sun); box-shadow: inset 0 0 0 3px var(--ink); }
.tb.sel small { color: #2B2A4C; }
.tb:active { transform: scale(.94); }

#stampPop { position: fixed; z-index: 40; display: grid; grid-template-columns: repeat(4, 56px); gap: 6px; padding: 12px; border-radius: 22px; background: var(--panel); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); }
#stampPop button { font-size: 34px; height: 56px; border-radius: 14px; background: var(--desk); }

@media (orientation: portrait) {
  .work { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  #tools { width: auto; flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; overflow: visible; padding: 10px; gap: 10px; }
  .swatches { grid-template-columns: repeat(8, 40px); gap: 7px; }
  .sw { width: 38px; height: 38px; }
  .sizes { border-block: 0; border-inline: 2px dashed var(--panel-edge); padding: 0 6px; flex-direction: row; gap: 4px; }
  .toolbtns { grid-template-columns: repeat(8, auto); }
  .tb { width: 60px; height: 58px; }
}
@media (max-width: 560px) {
  .ib { width: 46px; height: 46px; font-size: 22px; border-radius: 14px; }
  .titlebox { height: 46px; }
  .titlebox .g { font-size: 30px; }
  .titlebox .w { font-size: 18px; }
  .bar { gap: 6px; padding: 8px 10px 4px; }
  .work { padding: 6px 10px 10px; }
  .swatches { grid-template-columns: repeat(8, 32px); gap: 6px; }
  .sw { width: 32px; height: 32px; }
  .toolbtns { grid-template-columns: repeat(4, auto); }
  .tb { width: 54px; height: 50px; font-size: 22px; }
  .cnt { width: 44px; height: 44px; font-size: 28px; }
  .hide-sm { display: none !important; }
}

/* ---------- colour game ---------- */
#game { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 16px; border-radius: 22px; background: var(--panel); box-shadow: 0 8px 0 var(--press); }
#game h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: clamp(28px, 5vw, 52px); text-align: center; text-wrap: balance; }
#game h2 em { font-style: normal; padding: 0 .25em; border-radius: 14px; }
.blobs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: clamp(14px, 3vw, 34px); width: min(100%, 560px); }
@media (orientation: landscape) { .blobs { grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(100%, 900px); } }
.blob { aspect-ratio: 1; max-width: 100%; position: relative; background: var(--c); border-radius: 58% 42% 55% 45% / 50% 58% 42% 50%; box-shadow: inset 0 -12px 0 rgba(0, 0, 0, .15), 0 8px 0 var(--press); animation: wob 3s ease-in-out infinite; }
.blob:nth-child(2) { animation-delay: -.7s; border-radius: 45% 55% 40% 60% / 55% 45% 55% 45%; }
.blob:nth-child(3) { animation-delay: -1.4s; border-radius: 52% 48% 62% 38% / 42% 56% 44% 58%; }
.blob:nth-child(4) { animation-delay: -2.1s; }
.blob .eyes { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); display: flex; gap: 14%; width: 56%; justify-content: center; }
.blob .eyes i { width: 30%; aspect-ratio: 1; background: #fff; border-radius: 50%; position: relative; box-shadow: 0 0 0 2px rgba(0, 0, 0, .1); }
.blob .eyes i::after { content: ''; position: absolute; width: 48%; height: 48%; left: 30%; top: 30%; background: #2B2A4C; border-radius: 50%; }
.blob .mouth { position: absolute; left: 50%; top: 62%; width: 24%; height: 12%; transform: translateX(-50%); border-bottom: 5px solid rgba(43, 42, 76, .8); border-radius: 0 0 50% 50%; }
.blob.yay { animation: yay .7s ease; }
.blob.no { animation: shake .45s ease; }
@keyframes wob { 50% { transform: scale(1.04, .96); } }
@keyframes yay { 30% { transform: translateY(-30px) scale(1.15); } 60% { transform: translateY(0) scale(.95); } }
@keyframes shake { 20%, 60% { transform: translateX(-12px) rotate(-5deg); } 40%, 80% { transform: translateX(12px) rotate(5deg); } }
.score { font-size: 30px; min-height: 36px; letter-spacing: 2px; }

/* ---------- overlays ---------- */
.overlay { position: fixed; inset: 0; z-index: 30; background: var(--veil); display: grid; place-items: center; padding: 16px; animation: fade .2s ease; }
@keyframes fade { from { opacity: 0; } }
.panel { background: var(--panel); border-radius: 30px; width: min(100%, 980px); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 12px 0 var(--press); }
.panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px 10px 24px; gap: 10px; }
.panel-head h2 { margin: 0; font-family: var(--f-display); font-weight: 600; font-size: 30px; }
.pickgrid { overflow-y: auto; padding: 6px 20px 22px; display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; touch-action: pan-y; }
.pk { position: relative; aspect-ratio: 1; border-radius: 20px; background: var(--desk); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-family: var(--f-display); font-weight: 600; font-size: 44px; line-height: 1; overflow: hidden; }
.pk small { font-size: 13px; font-family: var(--f-body); font-weight: 800; color: var(--ink-soft); }
.pk svg { width: 82%; height: 82%; background: #fff; border-radius: 14px; }
.pk.cur { box-shadow: inset 0 0 0 4px var(--pink); }
.pk .st { position: absolute; top: 4px; right: 6px; font-size: 18px; }
.pk img { width: 100%; height: 100%; object-fit: cover; }
.cheer { background: var(--panel); border-radius: 36px; padding: 28px 30px 26px; text-align: center; display: flex; flex-direction: column; gap: 16px; align-items: center; box-shadow: 0 12px 0 var(--press); animation: popin .5s cubic-bezier(.3, 1.6, .5, 1); max-width: 100%; }
.cheer .stars { font-size: 54px; letter-spacing: 6px; }
.cheer h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(30px, 6vw, 48px); color: var(--pink); text-wrap: balance; }
.cheer .row { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.big { font-family: var(--f-display); font-weight: 600; font-size: 26px; padding: 14px 26px; border-radius: 20px; background: var(--desk); box-shadow: 0 6px 0 var(--press); }
.big.go { background: var(--mint); color: #fff; }
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--press); }
.viewer img { max-width: 100%; max-height: calc(100vh - 200px); border-radius: 22px; background: #fff; display: block; }
.viewer { display: flex; flex-direction: column; gap: 14px; align-items: center; }
.empty { grid-column: 1 / -1; text-align: center; padding: 30px 10px; color: var(--ink-soft); font-size: 18px; font-weight: 800; }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }

@media (prefers-reduced-motion: reduce) {
  .logo span, .blob, .ib.pulse { animation: none; }
}
</style>

<section id="home" class="screen">
  <div class="home-wrap">
    <header class="hero">
      <h1 class="logo" id="logo" aria-label="O Caderno da Yuna"></h1>
      <p class="tag">Toca, pinta e aprende com o dedo.</p>
    </header>
    <div class="cards" id="cards"></div>
    <footer class="parents">
      <button class="pill" id="hFull" type="button">⛶ Ecrã inteiro</button>
      <span>Para os pais: no tablet, ligue o som para ouvir as letras e os números. Os desenhos guardados ficam na Galeria deste aparelho.</span>
    </footer>
  </div>
</section>

<section id="act" class="screen" hidden>
  <div class="bar">
    <button class="ib" id="bHome" type="button" aria-label="Início">🏠</button>
    <button class="ib" id="bPrev" type="button" aria-label="Anterior">◀</button>

  <div id="countRow" hidden></div>
  <div class="work">
    <div id="stage">
      <div id="sheet">
        <canvas id="cG"></canvas><canvas id="cP"></canvas><canvas id="cL"></canvas>
        <div id="prog" hidden><i></i></div>
        <div id="reveal" hidden></div>
        <div id="flash"></div>
      </div>
      <div id="game" hidden>
        <h2 id="gQ"></h2>
        <div class="blobs" id="blobs"></div>
        <div class="score" id="gScore"></div>
      </div>

<div id="picker" class="overlay" hidden>
  <div class="panel">
    <div class="panel-head"><h2 id="pickTitle"></h2><button class="ib" id="pickClose" type="button" aria-label="Fechar">✕</button></div>

      <button class="big" id="cheerStay" type="button">🖍️ Continuar</button>

  </div>
</div>
<div id="viewer" class="overlay" hidden>
  <div class="viewer">
    <img id="viewImg" alt="Desenho guardado">
    <div class="cheer-row" style="display:flex;gap:14px">
      <button class="big" id="viewDel" type="button">🗑️ Apagar</button>
      <button class="big go" id="viewClose" type="button">Fechar</button>
    </div>
  </div>
</div>
<div id="stampPop" hidden></div>
<canvas id="fx"></canvas>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[(Math.random() * a.length) | 0];

/* ================= storage (per device, optional) ================= */
const KEY = 'caderno-yuna-v1', GKEY = 'caderno-yuna-galeria-v1';
let prog = {};
try { prog = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { prog = {}; }
const saveProg = () => { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} };
let gallery = [];
try { gallery = JSON.parse(localStorage.getItem(GKEY)) || []; } catch (e) { gallery = []; }
const saveGallery = () => {
  while (gallery.length) {
    try { localStorage.setItem(GKEY, JSON.stringify(gallery)); return true; }
    catch (e) { gallery.pop(); }
  }
  try { localStorage.removeItem(GKEY); } catch (e) {}
  return false;
};

/* ================= sound + voice ================= */
const Snd = {
  ctx: null, on: true,
  init() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; } }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d = .15, type = 'sine', v = .12, w = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + w, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + .05);
  },
  note(i) { const sc = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1567.98, 1760]; this.tone(sc[Math.max(0, Math.min(sc.length - 1, i | 0))], .25, 'triangle', .1); },
  pop() {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime, o = c.createOscillator(), g = c.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(980, t + .12);

/* ================= paper & scenes ================= */
function drawPaper(ctx, kind) {
  const u = U;
  ctx.save();
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, 0, W, H);
  if (kind === 'caderno' || kind === 'ruled') {
    ctx.strokeStyle = '#D5E3FF'; ctx.lineWidth = 3 * u;
    const step = H / 11;
    for (let y = step; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
    ctx.strokeStyle = '#FFB8C8'; ctx.lineWidth = 4 * u;
    ctx.beginPath(); ctx.moveTo(W * .07, 0); ctx.lineTo(W * .07, H); ctx.stroke();
  } else if (kind === 'quadrados' || kind === 'grid') {
    ctx.strokeStyle = '#E2E9FF'; ctx.lineWidth = 2.5 * u;
    const step = Math.min(W, H) / 14;
    for (let x = (W % step) / 2; x < W; x += step) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
    for (let y = (H % step) / 2; y < H; y += step) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  } else if (kind === 'ceu' || kind === 'jardim') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#8FD3FF'); g.addColorStop(1, '#E9F7FF');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#FFE680'; ctx.beginPath(); ctx.arc(W * .86, H * .16, 70 * u, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.9)';
    [[.2, .18, 1], [.55, .1, .8], [.42, .3, .6]].forEach(([x, y, s]) => puff(ctx, W * x, H * y, 60 * u * s));
    if (kind === 'jardim') {
      ctx.fillStyle = '#9BE07A'; ctx.beginPath(); ctx.moveTo(0, H * .72); ctx.quadraticCurveTo(W * .3, H * .58, W * .6, H * .72); ctx.quadraticCurveTo(W * .85, H * .62, W, H * .7); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
      ctx.fillStyle = '#6FCB55'; ctx.beginPath(); ctx.moveTo(0, H * .85); ctx.quadraticCurveTo(W * .5, H * .74, W, H * .86); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    }
  } else if (kind === 'mar') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5ED0F5'); g.addColorStop(1, '#1F6FD1');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#F6DFA4'; ctx.beginPath(); ctx.moveTo(0, H * .88); ctx.quadraticCurveTo(W * .5, H * .8, W, H * .9); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4 * u;
    for (let i = 0; i < 14; i++) { ctx.beginPath(); ctx.arc(rnd(0, W), rnd(H * .1, H * .75), rnd(8, 22) * u, 0, 7); ctx.stroke(); }
  } else if (kind === 'noite') {
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#141247'); g.addColorStop(1, '#3B2C7A');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 90; i++) { ctx.fillStyle = `rgba(255,255,255,${rnd(.4, 1)})`; ctx.beginPath(); ctx.arc(rnd(0, W), rnd(0, H), rnd(1.5, 4.5) * u, 0, 7); ctx.fill(); }
    ctx.fillStyle = '#FFF3B0'; ctx.beginPath(); ctx.arc(W * .82, H * .2, 80 * u, 0, 7); ctx.fill();
    ctx.fillStyle = '#1B1855'; ctx.beginPath(); ctx.arc(W * .82 + 34 * u, H * .2 - 18 * u, 70 * u, 0, 7); ctx.fill();
  }
  ctx.restore();
}
function puff(ctx, x, y, r) { [[0, 0, 1], [r * .9, r * .15, .8], [-r * .9, r * .2, .75], [r * .35, -r * .45, .8]].forEach(([dx, dy, s]) => { ctx.beginPath(); ctx.arc(x + dx, y + dy, r * s, 0, 7); ctx.fill(); }); }

/* ================= tracing (letters, numbers, shapes) ================= */
let fontReady = false;
async function ensureFont() {
  if (fontReady) return;
  try { await Promise.race([document.fonts.load('700 200px Fredoka'), new Promise(r => setTimeout(r, 2500))]); } catch (e) {}
  fontReady = true;
}
const glyphFont = s => `700 ${s}px Fredoka, "Arial Rounded MT Bold", "Trebuchet MS", sans-serif`;

async function setupTrace(opt, tok) {
  drawPaper(gctx, opt.glyph ? 'ruled' : 'grid');
  if (opt.glyph) await ensureFont();
  if (tok !== S.token) return;
  const m = document.createElement('canvas'); m.width = W; m.height = H;
  const mc = m.getContext('2d', { willReadFrequently: true });
  let g;
  gctx.save();
  if (opt.glyph) {
    const t = opt.glyph;
    mc.font = glyphFont(100);
    const m0 = mc.measureText(t);
    const gw = m0.actualBoundingBoxLeft + m0.actualBoundingBoxRight, gh = m0.actualBoundingBoxAscent + m0.actualBoundingBoxDescent;
    const sc = Math.min(W * .62 / gw, H * .74 / gh);
    const fs = 100 * sc;
    const x = W / 2 - (m0.actualBoundingBoxRight - m0.actualBoundingBoxLeft) * sc / 2;
    const y = H / 2 + (m0.actualBoundingBoxAscent - m0.actualBoundingBoxDescent) * sc / 2;
    const font = glyphFont(fs);
    mc.font = font; mc.fillStyle = '#000'; mc.fillText(t, x, y);
    gctx.font = font;
    gctx.fillStyle = 'rgba(139,92,246,.09)'; gctx.fillText(t, x, y);
    gctx.setLineDash([16 * U, 14 * U]); gctx.lineWidth = 5 * U; gctx.strokeStyle = 'rgba(139,92,246,.42)'; gctx.lineCap = 'round';
    gctx.strokeText(t, x, y);
    g = Math.max(fs * .058, 14 * U);
  } else {
    const R = Math.min(W, H) * .32;
    const p = new Path2D(); opt.shape.draw(p, W / 2, H / 2, R);
    const band = Math.max(R * .2, 40 * U);
    mc.lineWidth = band; mc.lineJoin = 'round'; mc.lineCap = 'round'; mc.strokeStyle = '#000'; mc.stroke(p);
    gctx.lineJoin = 'round'; gctx.lineCap = 'round';
    gctx.lineWidth = band; gctx.strokeStyle = 'rgba(35,197,154,.12)'; gctx.stroke(p);
    gctx.setLineDash([16 * U, 14 * U]); gctx.lineWidth = 5 * U; gctx.strokeStyle = 'rgba(35,197,154,.6)'; gctx.stroke(p);
    g = band * .42;
  }
  gctx.restore();
  // sample dots on a grid inside the mask
  const data = mc.getImageData(0, 0, W, H).data;
  const dots = [], map = new Map();
  const ox = (W / 2) % g, oy = (H / 2) % g;
  for (let iy = 0, y = oy; y < H; iy++, y += g) {
    for (let ix = 0, x = ox; x < W; ix++, x += g) {
      if (data[(((y | 0) * W) + (x | 0)) * 4 + 3] > 140) { map.set(ix + ',' + iy, dots.length); dots.push({ x, y, lit: false }); }
    }
  }
  trace = { dots, map, g, ox, oy, lit: 0, last: 0 };
  gctx.fillStyle = '#B7A6F5';
  dots.forEach(d => { gctx.beginPath(); gctx.arc(d.x, d.y, g * .2, 0, 7); gctx.fill(); });
  // a green start dot: top-most then left-most
  if (dots.length) {
    const s = dots.reduce((a, b) => (b.y < a.y - 1 || (Math.abs(b.y - a.y) <= 1 && b.x < a.x)) ? b : a);
    gctx.fillStyle = '#23C59A'; gctx.beginPath(); gctx.arc(s.x, s.y, g * .42, 0, 7); gctx.fill();
    gctx.fillStyle = '#fff'; gctx.beginPath(); gctx.arc(s.x, s.y, g * .16, 0, 7); gctx.fill();
  }
  $('#prog').hidden = false; $('#prog i').style.width = '0%';
}
function traceHit(x, y, rad) {
  const T = trace; if (!T || S.done) return;
  const g = T.g, r2 = rad * rad;
  const ix0 = Math.floor((x - rad - T.ox) / g), ix1 = Math.ceil((x + rad - T.ox) / g);
  const iy0 = Math.floor((y - rad - T.oy) / g), iy1 = Math.ceil((y + rad - T.oy) / g);
  let hit = 0;
  for (let iy = iy0; iy <= iy1; iy++) for (let ix = ix0; ix <= ix1; ix++) {
    const k = T.map.get(ix + ',' + iy); if (k == null) continue;
    const d = T.dots[k]; if (d.lit) continue;
    const dx = d.x - x, dy = d.y - y;
    if (dx * dx + dy * dy <= r2) {
      d.lit = true; T.lit++; hit++;
      gctx.fillStyle = S.color === 'rainbow' ? `hsl(${(d.x / W * 360) | 0},90%,60%)` : S.color === '#FFFFFF' ? '#FFD93D' : S.color;
      gctx.beginPath(); gctx.arc(d.x, d.y, g * .34, 0, 7); gctx.fill();
    }
  }
  if (hit) {
    const frac = T.lit / T.dots.length;
    $('#prog i').style.width = Math.min(100, frac / .88 * 100) + '%';
    const now = performance.now();
    if (now - T.last > 70) { Snd.note(frac * 10); T.last = now; }
    if (Math.random() < .35) { const c = toClient(x, y); burst(c[0], c[1], 3, ['#FFD93D', '#FF70A6', '#4CC9F0']); }
    if (frac >= .88) finishItem();
  }
}

/* ================= colouring pages ================= */
function pageSVG(it, px) {
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${px}" height="${px}" viewBox="0 0 400 400" fill="none" stroke="${INK}" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">${it.svg('c' + it.key + (px | 0))}</svg>`;
}
function setupColor(it, tok) {
  drawPaper(gctx, 'folha');
  const s = Math.min(W, H) * .94;
  const img = new Image();
  img.onload = () => {
    if (tok !== S.token) return;
    lctx.drawImage(img, (W - s) / 2, (H - s) / 2, s, s);
    const d = lctx.getImageData(0, 0, W, H).data;
    lineAlpha = new Uint8Array(W * H);
    for (let i = 0, j = 3; i < lineAlpha.length; i++, j += 4) lineAlpha[i] = d[j];
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(pageSVG(it, Math.round(s)));
}

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

}
function floodFill(x, y) {

    else if (cat.mode === 'dots') inner = done ? `${it.emoji}<small>${it.name}</small>` : `❓<small>${it.pts.length} pontos</small>`;
    else if (cat.mode === 'draw') inner = `${it.emoji}<small>${it.name}</small>`;
    b.innerHTML = inner + (done ? '<span class="st">⭐</span>' : '');
    b.addEventListener('click', () => { $('#picker').hidden = true; Snd.pop(); loadItem(i); });
    grid.appendChild(b);
  });
  $('#picker').hidden = false;
}
function openGallery() {
  $('#pickTitle').textContent = 'Galeria da Yuna';
  const grid = $('#pickGrid'); grid.innerHTML = '';
  if (!gallery.length) grid.appendChild(el('div', 'empty', 'Ainda não há desenhos. Pinta alguma coisa e carrega em 📸 Guardar!'));
  gallery.forEach((g, i) => {
    const b = el('button', 'pk'); b.type = 'button';
    const im = new Image(); im.src = g.src; im.alt = 'Desenho ' + (i + 1); b.appendChild(im);
    b.addEventListener('click', () => { viewIdx = i; $('#viewImg').src = g.src; $('#viewer').hidden = false; });
    grid.appendChild(b);
  });
  $('#picker').hidden = false;
}
let viewIdx = -1;
$('#viewClose').addEventListener('click', () => { $('#viewer').hidden = true; });
$('#viewDel').addEventListener('click', () => { if (viewIdx >= 0) { gallery.splice(viewIdx, 1); saveGallery(); } $('#viewer').hidden = true; openGallery(); renderCards(); });
$('#pickClose').addEventListener('click', () => { $('#picker').hidden = true; });
$('#picker').addEventListener('click', e => { if (e.target.id === 'picker') $('#picker').hidden = true; });

function saveDrawing() {
  const max = 900, k = Math.min(1, max / Math.max(W, H));
  const c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(H * k);
  const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height);
  [cG, cP, cL].forEach(src => x.drawImage(src, 0, 0, c.width, c.height));
  let src; try { src = c.toDataURL('image/jpeg', .8); } catch (e) { return; }
  gallery.unshift({ t: Date.now(), src }); if (gallery.length > 12) gallery.length = 12;
  const ok = saveGallery();
  const f = $('#flash'); f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  Snd.shutter(); confetti(60);
  say(ok ? 'Guardado na galeria! Que bonito!' : 'Que bonito!');
}

/* ================= particles ================= */
const fx = $('#fx'), fctx = fx.getContext('2d');
let parts = [], fxRAF = 0;
function sizeFx() { const k = Math.min(window.devicePixelRatio || 1, 2); fx.width = innerWidth * k; fx.height = innerHeight * k; fctx.setTransform(k, 0, 0, k, 0, 0); }
sizeFx(); addEventListener('resize', sizeFx);
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
function burst(x, y, n, cols) {
  if (reduced) return;
  for (let i = 0; i < n; i++) { const a = rnd(0, Math.PI * 2), v = rnd(2, 7); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, g: .25, life: rnd(30, 50), max: 50, c: pick(cols), s: rnd(4, 9), kind: 'star', r: rnd(0, 6), vr: rnd(-.2, .2) }); }
  runFx();
}
function confetti(n = 140) {
  if (reduced) return;
  const cols = ['#FF5D8F', '#FFC23D', '#23C59A', '#3E95FF', '#8B5CF6', '#FF8A3D'];
  for (let i = 0; i < n; i++) parts.push({ x: rnd(0, innerWidth), y: rnd(-innerHeight * .3, -10), vx: rnd(-2, 2), vy: rnd(2, 6), g: .08, life: rnd(110, 170), max: 170, c: pick(cols), s: rnd(7, 13), kind: Math.random() < .5 ? 'rect' : 'circ', r: rnd(0, 6), vr: rnd(-.2, .2) });
  runFx();
}
function runFx() { if (!fxRAF) fxRAF = requestAnimationFrame(stepFx); }
function stepFx() {
  fctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vy += p.g; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life--;
    fctx.save(); fctx.globalAlpha = Math.min(1, p.life / 25); fctx.translate(p.x, p.y); fctx.rotate(p.r); fctx.fillStyle = p.c;
    if (p.kind === 'rect') fctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
    else if (p.kind === 'circ') { fctx.beginPath(); fctx.arc(0, 0, p.s / 2.4, 0, 7); fctx.fill(); }
    else { fctx.beginPath(); const q = starPts(0, 0, p.s, p.s * .45); q.forEach((pt, i) => i ? fctx.lineTo(pt[0], pt[1]) : fctx.moveTo(pt[0], pt[1])); fctx.fill(); }
    fctx.restore();
  }
  fxRAF = parts.length ? requestAnimationFrame(stepFx) : 0;
  if (!parts.length) fctx.clearRect(0, 0, innerWidth, innerHeight);
}

/* ================= bar buttons & misc ================= */
let unlocked = false, wake = null;
function unlock() {
  Snd.init();
  if (!unlocked) {
    unlocked = true;
    try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) {}
  }
}
function goFull() {
  const d = document.documentElement;
  try { const r = (d.requestFullscreen || d.webkitRequestFullscreen || (() => null)).call(d); if (r && r.catch) r.catch(() => {}); } catch (e) {}
}
$('#hFull').addEventListener('click', () => { unlock(); goFull(); });
$('#bHome').addEventListener('click', () => { Snd.tick(); goHome(); });
$('#bPrev').addEventListener('click', () => { unlock(); Snd.tick(); loadItem(S.index - 1); });
$('#bNext').addEventListener('click', () => { unlock(); Snd.tick(); loadItem(S.index + 1); });
$('#bGrid').addEventListener('click', () => { Snd.tick(); openPicker(); });
$('#bCase').addEventListener('click', () => { S.upper = !S.upper; $('#bCase').textContent = S.upper ? 'Aa' : 'aA'; Snd.tick(); loadItem(S.index); });
$('#bTitle').addEventListener('click', () => {
  unlock();
  const it = S.cat && S.cat.items[S.index]; if (!it) return;
  if (S.cat.id === 'letras') say(`${it.L} de ${it.w}`);
  else if (S.cat.id === 'numeros') say(it.w);
  else if (S.cat.id === 'formas') say(it.name);
  else if (S.mode === 'color') say(it.name);
  else if (S.mode === 'dots') say(D && D.done ? `É ${it.said}!` : 'Liga os pontos!');
  else if (S.mode === 'game' && G.target) say(`Onde está o ${G.target[0]}?`);
  else if (it.name) say(it.name);
});
$('#bSound').addEventListener('click', () => {
  Snd.on = !Snd.on; $('#bSound').textContent = Snd.on ? '🔊' : '🔇';
  if (!Snd.on) { try { speechSynthesis.cancel(); } catch (e) {} } else { unlock(); Snd.tick(); }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && unlocked && !wake) { try { navigator.wakeLock && navigator.wakeLock.request('screen').then(w => { wake = w; }).catch(() => {}); } catch (e) {} }
  if (document.visibilityState === 'hidden') wake = null;
});

buildHome();
})();
