<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Menu Real</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<meta name="theme-color" content="#e8e6e3">
<meta name="description" content="Menu Real: vê o prato real antes de pedir e pede direto da mesa.">
<style>
/* Layout: app de telemóvel centrado (cliente) + quadro de colunas (cozinha/bar) + lista de gestão; uma só barra de topo */
:root{
  /* mundo único, claro e quente (ref.: Smart Kitchen Assistant) */
  --bg:#e8e6e3; --surface:#f6f5f3; --ink:#2a2a2e; --muted:#85858c; --line:#d9d6d2; --soft:#efedea;
  --accent:#2a2a2e; --accent-ink:#ffffff; --accent-soft:#e3e0dc; --ok:#2f9e6f; --warn:#c98a1b; --bad:#d4553a;
  --acc:#f5a06a; --acc-ink:#2a2a2e;
  --f-ui:"Outfit",system-ui,-apple-system,"Segoe UI",sans-serif; --f-serif:"Outfit",system-ui,sans-serif;
  --r:22px; --shadow:0 1px 2px rgba(40,36,30,.05),0 18px 40px -22px rgba(40,36,30,.35);
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.cx-mode .top{display:none}
body.cx-mode.staff .top{display:block}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}

/* Barra de topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:480px){.brand span{display:none}.seg button{padding:6px 10px}}
.brand span{font-family:var(--f-serif);font-style:italic;font-size:19px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}

/* ===== Cliente ===== */
.client{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h1{font-family:var(--f-serif);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.01em}
.hello p{color:var(--muted);font-size:14px;margin-top:6px}
.table-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;border-radius:999px;padding:5px 10px;white-space:nowrap}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

.ask{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.ask .spark{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ask b{display:block;font-weight:600}
.ask small{color:var(--muted);font-size:13px}

.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:20;background:var(--bg);margin:0 -16px;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.sec{display:flex;flex-direction:column;gap:2px;scroll-margin-top:120px}
.sec h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 8px}
.item{display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.item .nm{font-weight:600;font-size:16px}
.item .ds{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{font-weight:600;font-size:14px}
.item.out{opacity:.45}
.thumb{width:92px;height:92px;border-radius:14px;overflow:hidden;background:var(--soft);position:relative;display:grid;place-items:center;max-width:100%}
.thumb img,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.nophoto{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;text-align:center;line-height:1.15;padding:6px}
.nophoto svg{opacity:.6}
.real{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:#15181d;font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.badge.hot{background:var(--accent-soft);color:var(--accent)}

/* Barra do pedido */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.cartbar button{pointer-events:auto;max-width:520px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:14px;background:var(--ink);color:var(--bg);padding:15px 18px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.cartbar .cnt{background:var(--bg);color:var(--ink);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;margin-right:10px;padding:0 6px}

/* Folhas (bottom sheets) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{width:100%;max-width:560px;max-height:min(92vh,100%);overflow:auto;background:var(--surface);border-radius:30px 30px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.scrim.show .sheet{transform:none}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:17px;font-weight:700}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.sheet-b{padding:18px;display:flex;flex-direction:column;gap:18px}
.hero{aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;background:var(--soft);display:grid;place-items:center;position:relative}
.hero .real{left:12px;bottom:12px;font-size:12px;padding:4px 10px}
.hero .nophoto{font-size:13px;gap:8px}
.dish-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dish-h h2{font-family:var(--f-serif);font-weight:400;font-size:30px;line-height:1.05}
.dish-h .pr{font-weight:700;font-size:18px;white-space:nowrap}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.opt h4{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
.chip.ingc{background:var(--surface);border-color:var(--line);color:var(--ink);font-weight:500}
.chip.ingc.off{background:transparent;border-style:dashed;color:var(--muted);text-decoration:line-through}
textarea,input[type=text],input[type=tel]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:12px;align-items:center}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px}
.qty button{border:0;background:transparent;width:42px;height:46px;font-size:20px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.primary{flex:1;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 16px;display:flex;justify-content:space-between;gap:10px}
.primary:disabled{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.line{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.line small{display:block;color:var(--muted);font-size:13px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px}
.track{display:flex;flex-direction:column;gap:10px}
.trk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.status{font-weight:700;font-size:14px}

/* Assistente */
.chat{display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.recs{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.rec b{font-weight:600}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.composer{position:sticky;bottom:0;background:var(--surface);padding-top:8px;display:flex;gap:8px}
.composer input{flex:1}
.composer button{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 16px}
.dots::after{content:"…";animation:blink 1s steps(3,end) infinite}
@keyframes blink{50%{opacity:.3}}

.sect{display:flex;flex-direction:column;gap:10px}
.sect h4{margin:0;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{background:var(--soft);border-radius:999px;padding:5px 11px;font-size:13.5px}
.nutr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.nutr div{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;min-width:0}
.nutr b{font-size:18px}
.nutr small{font-size:11.5px;color:var(--muted);overflow-wrap:anywhere}
.macro{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--line)}
.macro i:nth-child(1){background:var(--accent)} .macro i:nth-child(2){background:var(--warn)} .macro i:nth-child(3){background:var(--bad)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:1px}
.legend span:nth-child(1)::before{background:var(--accent)} .legend span:nth-child(2)::before{background:var(--warn)} .legend span:nth-child(3)::before{background:var(--bad)}
.fine{font-size:12.5px;color:var(--muted)}
.real.ilus{background:rgba(20,22,28,.72);color:#fff}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi small{color:var(--muted);font-size:12.5px;font-weight:600}
.kpi b{font-size:24px;font-weight:700}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tbl{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:104px}
.tbl b{font-size:16px}
.tbl.free{background:transparent;color:var(--muted)}
.tbl.bill{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted);align-self:flex-start}
.pill.on{background:var(--accent);color:var(--accent-ink)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.form{display:grid;gap:12px}
.form label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.form .g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
input[type=number]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.qr{background:#fff;color:#15181d;border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.qr .code img,.qr .code canvas{width:140px!important;height:140px!important}
.qr b{font-size:15px}
.credits{font-size:12px;color:var(--muted);line-height:1.6}
.credits a{color:inherit}
.linkbtn{border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px;align-self:center}

/* ===== Cliente · palco ===== */
.cx{position:relative;overflow-x:clip;max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 130px;display:flex;flex-direction:column;gap:22px}
.cx-head{display:flex;justify-content:space-between;align-items:center;gap:12px;position:relative;z-index:3}
.cx-brand{display:flex;flex-direction:column;line-height:1.1;min-width:0}
.cx-brand b{font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cx-brand small{font-size:12px;color:var(--muted);letter-spacing:.04em}
.cx-tools{display:flex;gap:8px;align-items:center}
.chip-ink{white-space:nowrap}
.chip-ink.call .sm{display:none}
@media (max-width:599px){.chip-ink.call .lg{display:none}.chip-ink.call .sm{display:inline}.cx-brand{min-width:0}.cx-brand b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}}
.chip-ink.call{background:var(--ink);color:var(--bg)}
.chip-ink.call.on{background:var(--acc);color:var(--ink)}
.chip-ink.call.on svg{animation:ring 1.2s ease-in-out infinite;transform-origin:50% 10%}
@keyframes ring{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(16deg)}20%,40%{transform:rotate(-16deg)}}
.alert.call{background:color-mix(in srgb,#f6d36b 35%,var(--surface))}
.chip-ink{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;background:var(--surface);padding:8px 13px;font-weight:600;font-size:13px;box-shadow:var(--shadow)}
.ibtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.live{display:flex;align-items:center;gap:10px;border:0;width:100%;text-align:left;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;font-weight:500;position:relative;z-index:3}
.live i{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none;animation:pulse 1.6s ease-in-out infinite}
.live span{flex:1}
@keyframes pulse{50%{transform:scale(1.6);opacity:.5}}

.stage{position:relative;display:grid;grid-template-columns:1fr;gap:18px;align-items:center}
.arc{position:absolute;z-index:0;left:50%;top:-6%;width:min(150vw,980px);aspect-ratio:1;border-radius:50%;border:clamp(60px,14vw,130px) solid var(--acc);border-right-color:transparent;border-bottom-color:transparent;opacity:.24;transform:translateX(-35%) rotate(var(--arcR,-20deg));pointer-events:none;transition:border-color .9s ease,transform 1.2s cubic-bezier(.16,1,.3,1)}
.plate-wrap{position:relative;z-index:1;justify-self:center;width:min(78vw,380px);aspect-ratio:1;max-width:100%}
.pl{position:absolute;inset:0;will-change:transform}
.plate{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8b8781,#5f5b56 70%);box-shadow:0 40px 60px -28px rgba(30,25,20,.55),0 12px 20px -10px rgba(30,25,20,.35);overflow:hidden;display:grid;place-items:center}
.plate img{position:absolute;inset:5%;width:90%;height:90%;border-radius:50%;object-fit:cover}
.plate .ph{display:flex;flex-direction:column;align-items:center;gap:8px;color:#8d877f;font-weight:500;font-size:14px;text-align:center}
.plate.empty{background:radial-gradient(circle at 40% 35%,#fbfaf8,#e4dfd8 62%,#d4cec6 63%,#ebe7e1 75%)}
.photo-tag{position:absolute;z-index:2;left:50%;bottom:2%;transform:translateX(-50%);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;box-shadow:var(--shadow);white-space:nowrap}
.photo-tag.real{background:var(--ink);color:#fff}
.dish-t{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.eyebrow{font-weight:600;font-size:14px;color:var(--ink)}
.eyebrow span{color:var(--muted);font-weight:400}
.dname{margin:0;line-height:.92;text-transform:uppercase;letter-spacing:-.025em;overflow-wrap:normal;hyphens:none}
.dname .ln{display:block;overflow:hidden;padding-bottom:.04em}
.dname .ln>span{display:block;will-change:transform,clip-path}
.dname .l1{display:block;font-weight:200;font-size:clamp(28px,calc(11vw * var(--k1,1)),calc(92px * var(--k1,1)))}
.dname .l2{display:block;font-weight:800;font-size:clamp(30px,calc(12.5vw * var(--k2,1)),calc(104px * var(--k2,1)))}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn-add{transition:transform .2s cubic-bezier(.16,1,.3,1),box-shadow .3s;box-shadow:0 14px 26px -14px rgba(30,25,20,.6);}
.btn-add:active{transform:scale(.96)}

 if(e.target.closest("#openCart")){cartSheet();return;}
 if(e.target.closest("#callBtn")){svcSheet();return;}
 if(e.target.closest("#openReq")){if(pendReq("garcom")){toast(L().openAsk);return;}sendReq("garcom",null,{abrir:true});return;}
 if(e.target.closest("#billBtn")){askBill(e.target.closest("#billBtn"));return;}
 if((t=e.target.closest("[data-st]"))){S.kstation=t.dataset.st;render();return;}
 if((t=e.target.closest("[data-adv]"))){t.disabled=true;store.setStatus(t.dataset.adv,t.dataset.next).catch(function(e){t.disabled=false;pinErr(e);});return;}
 if((t=e.target.closest("[data-req]"))){store.doneRequest(t.dataset.req).catch(pinErr);return;}
 if((t=e.target.closest("[data-table]"))){tableSheet(t.dataset.table);return;}
 if((t=e.target.closest("[data-edit]"))){editSheet(t.dataset.edit);return;}
 if((t=e.target.closest("[data-mtab]"))){S.mtab=t.dataset.mtab;sdAt=0;render();return;}
 if((t=e.target.closest("[data-cancel]"))){store.setStatus(t.dataset.cancel,"cancelado").catch(pinErr);return;}
 if(e.target.closest("#dlqr")){if(!downloads){qrSheetPng().then(function(blob){var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="menu-real-qr-mesas.png";document.body.appendChild(a);a.click();a.remove();toast("✓ QR descarregados");});return;}qrSheetPng().then(function(blob){return downloads.save({filename:"menu-real-qr-mesas.png",data:blob});}).then(function(){toast("✓ Ficheiro pronto");}).catch(function(){toast("Download cancelado.");});return;}
 if((t=e.target.closest("[data-sold]"))){var id=t.dataset.sold;store.setItem(id,{soldOut:!soldOut(id)}).catch(pinErr);return;}
 if((t=e.target.closest("[data-hide]"))){var hid=t.dataset.hide;store.setItem(hid,{hidden:!(S.items[hid]&&S.items[hid].hidden)}).catch(pinErr);return;}
 if(e.target.closest("#addDish")){newDish();return;}
 if((t=e.target.closest("[data-ack]"))){var pa=t.dataset.ack.split("|");ls(ackKey(pa[0],pa[1]),1);render();return;}
 if((t=e.target.closest("[data-kick]"))){var pk=t.dataset.kick.split("|");if(!confirm("Cancelar os pedidos ainda não preparados deste telemóvel na mesa "+pk[0]+"?"))return;ls(ackKey(pk[0],pk[1]),1);Promise.all(S.orders.filter(function(o){return o.mesa===pk[0]&&o.gid===pk[1]&&o.status==="novo";}).map(function(o){return store.setStatus(o.id,"cancelado");})).then(function(){toast("Pedidos cancelados");render();}).catch(pinErr);return;}
 if((t=e.target.closest("[data-openm]"))){var po=t.dataset.openm.split("|");t.disabled=true;store.setTable(po[0],true).then(function(){return store.doneRequest(po[1]);}).then(function(){toast("🔓 Mesa "+po[0]+" aberta");}).catch(pinErr);return;}
 if((t=e.target.closest("[data-print]"))){var oo=S.orders.filter(function(o){return o.id===t.dataset.print;})[0];if(oo)printTicket(oo);return;}
 if(e.target.closest("#npSave")){changePin();return;}
 if(e.target.closest("#cfPause")){store.setSettings({paused:!S.settings.paused}).then(function(){toast(S.settings.paused?"⏸ Pedidos em pausa":"▶ A aceitar pedidos");}).catch(pinErr);return;}
 if((t=e.target.closest("[data-dgo]"))){t.disabled=true;var bt=t.dataset.dgo;Promise.all(S.orders.filter(function(o){return o.batch===bt&&o.status!=="cancelado";}).map(function(o){return store.setStatus(o.id,"caminho");})).then(function(){toast("🛵 Saiu para entrega");}).catch(pinErr);return;}
 if((t=e.target.closest("[data-ddone]"))){t.disabled=true;var bd=t.dataset.ddone,os2=S.orders.filter(function(o){return o.batch===bd&&o.status!=="cancelado";});Promise.all(os2.map(function(o){return store.setStatus(o.id,"entregue");})).then(function(){return store.pay("ENT",bd,t.dataset.dpay,0);}).then(function(){toast("✓ Entrega concluída e paga");}).catch(pinErr);return;}
 if(e.target.closest("#cfDel")){store.setSettings({deliveryOn:S.settings.deliveryOn===false}).catch(pinErr);return;}
 if(e.target.closest("#cfCopy")){var u=APP_URL+"#entrega";(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(function(){toast("✓ Link copiado");}).catch(function(){prompt("Copia o link:",u);});return;}
 if(e.target.closest("#rpPrint")){window.print();return;}
 if(e.target.closest("#logout")){S.pin="";ls("pin","");S.staff=false;S.view="client";render();return;}
});
document.addEventListener("change",function(e){
 if(e.target.id==="cfEvent"){store.setSettings({event:e.target.value.trim()}).then(function(){toast("✓ Programa publicado");}).catch(pinErr);return;}
 if(e.target.id==="cfFee"){store.setSettings({deliveryFee:Math.max(0,Math.round(+e.target.value||0))}).catch(pinErr);return;}
 if(e.target.id==="cfArea"){store.setSettings({deliveryArea:e.target.value.trim()}).catch(pinErr);return;}
 if(e.target.id==="rnameIn"){store.setSettings({name:e.target.value.trim()||"Restaurante"}).catch(pinErr);return;}
 if(e.target.id==="ntab"){var n=Math.max(1,Math.min(99,parseInt(e.target.value,10)||12));store.setSettings({tables:n}).catch(pinErr);return;}
 var inp=e.target.closest("[data-photo]");if(!inp||!inp.files||!inp.files[0]||!(assets||sb))return;
 var id=inp.dataset.photo;toast("A carregar foto…");
 shrink(inp.files[0]).then(function(b){if(sb){var path=id+"-"+Date.now()+".jpg";return sb.storage.from("menureal").upload(path,b,{contentType:"image/jpeg",upsert:false}).then(function(r){if(r.error)throw r.error;return {url:sb.storage.from("menureal").getPublicUrl(path).data.publicUrl,id:path};});}return assets.upload(b,{type:"image/jpeg"});}).then(function(r){return store.setItem(id,{photoUrl:r.url,assetId:r.id});}).then(function(){toast("✓ Foto publicada no menu");if(openSheet&&openSheet.rerender)openSheet.rerender();}).catch(function(err){toast(err&&err.code==="too_large"?"Foto demasiado grande.":"Não foi possível carregar a foto.");});
});
var io=null;
function watchCats(){if(!("IntersectionObserver" in window))return;if(io)io.disconnect();io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){var id=en.target.id.replace("cat-","");if(S.cat!==id){S.cat=id;document.querySelectorAll("[data-cat]").forEach(function(b){var on=b.dataset.cat===id;b.setAttribute("aria-pressed",String(on));if(on&&b.scrollIntoView)b.parentNode.scrollTo({left:b.offsetLeft-16,behavior:"smooth"});});}}});},{rootMargin:"-130px 0px -65% 0px"});document.querySelectorAll(".sec").forEach(function(s){io.observe(s);});}

setInterval(function(){if((S.view==="kitchen"||S.view==="room"||S.view==="waiter")&&!openSheet)render();},30000);

var wideMQ=window.matchMedia&&window.matchMedia("(min-width:600px)");if(wideMQ&&wideMQ.addEventListener)wideMQ.addEventListener("change",function(){if(S.view==="client"&&!TX.busy)swapStage();});
/* ---------- Arranque ---------- */
applyOverrides();
render();
if(sb)sbStart();
if(window.claude&&window.claude.use){
 window.claude.use("db").then(function(d){if(d){db=d;subscribe();render();}});
 window.claude.use("sample").then(function(s){sample=s;});
 window.claude.use("assets").then(function(a){assets=a;if(S.view==="manage")render();});
 window.claude.use("downloads").then(function(d){downloads=d;if(S.view==="manage")render();});
}
})();
