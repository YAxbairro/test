<title>Menu Real</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: app de telemóvel centrado (cliente) + quadro de colunas (cozinha/bar) + lista de gestão; uma só barra de topo */
:root{
  --bg:#f6f7f8; --surface:#ffffff; --ink:#15181d; --muted:#667080; --line:#e4e7eb; --soft:#eef1f4;
  --accent:#0a66c2; --accent-ink:#ffffff; --accent-soft:#e6f0fa; --ok:#13865b; --warn:#b26b00; --bad:#c2410c;
  --f-ui:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif; --f-serif:"Instrument Serif",Georgia,serif;
  --r:16px; --shadow:0 1px 2px rgba(16,24,40,.06),0 8px 24px -12px rgba(16,24,40,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1013;--surface:#171a1f;--ink:#eef0f3;--muted:#98a1ae;--line:#272b33;--soft:#1e2228;--accent:#5aa9f0;--accent-ink:#06121f;--accent-soft:#16283a;--ok:#3fbf8a;--warn:#e0a03c;--bad:#f08a5d;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1013;--surface:#171a1f;--ink:#eef0f3;--muted:#98a1ae;--line:#272b33;--soft:#1e2228;--accent:#5aa9f0;--accent-ink:#06121f;--accent-soft:#16283a;--ok:#3fbf8a;--warn:#e0a03c;--bad:#f08a5d;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3,p{margin:0}

/* Barra de topo */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--bg)}
.top-in{max-width:1180px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:12px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand b{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
@media (max-width:480px){.brand span{display:none}.seg button{padding:6px 10px}}
.brand span{font-family:var(--f-serif);font-style:italic;font-size:19px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 120px}

/* ===== Cliente ===== */
.client{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.hello h1{font-family:var(--f-serif);font-weight:400;font-size:34px;line-height:1.05;letter-spacing:-.01em}
.hello p{color:var(--muted);font-size:14px;margin-top:6px}
.table-tag{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;border-radius:999px;padding:5px 10px;white-space:nowrap}
.langs{display:flex;gap:6px;flex-wrap:wrap}
.langs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

.ask{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.ask .spark{width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.ask b{display:block;font-weight:600}
.ask small{color:var(--muted);font-size:13px}

.cats{position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);z-index:20;background:var(--bg);margin:0 -16px;padding:8px 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cats button{flex:none;border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.sec{display:flex;flex-direction:column;gap:2px;scroll-margin-top:120px}
.sec h2{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 0 8px}
.item{display:grid;grid-template-columns:1fr 92px;gap:14px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{display:flex;flex-direction:column;gap:4px;min-width:0}
.item .nm{font-weight:600;font-size:16px}
.item .ds{color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .pr{font-weight:600;font-size:14px}
.item.out{opacity:.45}
.thumb{width:92px;height:92px;border-radius:14px;overflow:hidden;background:var(--soft);position:relative;display:grid;place-items:center;max-width:100%}
.thumb img,.hero img{width:100%;height:100%;object-fit:cover;display:block}
.nophoto{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;text-align:center;line-height:1.15;padding:6px}
.nophoto svg{opacity:.6}
.real{position:absolute;left:6px;bottom:6px;background:rgba(255,255,255,.92);color:#15181d;font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.badge.hot{background:var(--accent-soft);color:var(--accent)}

/* Barra do pedido */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.cartbar button{pointer-events:auto;max-width:520px;margin:0 auto;width:100%;display:flex;justify-content:space-between;align-items:center;border:0;border-radius:14px;background:var(--ink);color:var(--bg);padding:15px 18px;font-weight:600;box-shadow:0 12px 30px -10px rgba(0,0,0,.45)}
.cartbar .cnt{background:var(--bg);color:var(--ink);border-radius:999px;min-width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;margin-right:10px;padding:0 6px}

/* Folhas (bottom sheets) */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,12,16,.45);display:flex;align-items:flex-end;justify-content:center;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{width:100%;max-width:560px;max-height:min(92vh,100%);overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:0 0 calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(24px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.scrim.show .sheet{transform:none}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:22px;max-height:88vh}}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:17px;font-weight:700}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none}
.sheet-b{padding:18px;display:flex;flex-direction:column;gap:18px}
.hero{aspect-ratio:4/3;max-width:100%;border-radius:16px;overflow:hidden;background:var(--soft);display:grid;place-items:center;position:relative}
.hero .real{left:12px;bottom:12px;font-size:12px;padding:4px 10px}
.hero .nophoto{font-size:13px;gap:8px}
.dish-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.dish-h h2{font-family:var(--f-serif);font-weight:400;font-size:30px;line-height:1.05}
.dish-h .pr{font-weight:700;font-size:18px;white-space:nowrap}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.opt h4{margin:0 0 8px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
textarea,input[type=text]{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:12px;align-items:center}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px}
.qty button{border:0;background:transparent;width:42px;height:46px;font-size:20px}
.qty span{min-width:22px;text-align:center;font-weight:700}
.primary{flex:1;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:14px 16px;display:flex;justify-content:space-between;gap:10px}
.primary:disabled{opacity:.5;cursor:default}
.ghost{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600}
.line{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.line small{display:block;color:var(--muted);font-size:13px}
.total{display:flex;justify-content:space-between;font-weight:700;font-size:18px}
.hint{font-size:13px;color:var(--muted);background:var(--soft);border-radius:12px;padding:10px 12px}
.track{display:flex;flex-direction:column;gap:10px}
.trk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--accent)}
.status{font-weight:700;font-size:14px}

/* Assistente */
.chat{display:flex;flex-direction:column;gap:12px;min-height:240px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;font-size:14.5px;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.recs{display:flex;flex-direction:column;gap:6px;align-self:stretch}
.rec{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left}
.rec b{font-weight:600}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.composer{position:sticky;bottom:0;background:var(--surface);padding-top:8px;display:flex;gap:8px}
.composer input{flex:1}
.composer button{border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:0 16px}
.dots::after{content:"…";animation:blink 1s steps(3,end) infinite}
@keyframes blink{50%{opacity:.3}}

/* ===== Cozinha / Bar ===== */
.kitchen{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.k-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.k-head h1{font-size:22px;font-weight:700}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-soft);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:600}
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:820px){.board{grid-template-columns:1fr}}
.col{background:var(--soft);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ord{background:var(--surface);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.ord-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ord-h b{font-size:17px}
.ord ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord li{font-size:15px}
.ord li small{display:block;color:var(--bad);font-weight:600;font-size:13px}
.ord .who{color:var(--muted);font-size:13px}
.adv{border:0;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:700;padding:11px}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:22px 8px}
.station{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--soft);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}

/* ===== Gestão ===== */
.manage{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.mrow{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.mrow .thumb{width:64px;height:64px;border-radius:10px}
.mrow .acts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.mrow label.ghost{display:inline-block;font-size:13px;padding:8px 10px;cursor:pointer}
.sw{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:13px;font-weight:600}
.sw[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.banner{font-size:13px;color:var(--muted);text-align:center}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 16px;font-weight:600;font-size:14px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){.scrim,.sheet{transition:none}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand"><b>Menu Real</b><span id="rname">Quintal da Música</span></div>
    <div class="seg" role="group" aria-label="Vista da demonstração">
      <button type="button" data-view="client" aria-pressed="true">Cliente</button>
      <button type="button" data-view="kitchen" aria-pressed="false">Cozinha</button>
      <button type="button" data-view="manage" aria-pressed="false">Gestão</button>
    </div>
  </div>
</header>

<main id="app"></main>
<div class="cartbar" id="cartbar" hidden><button type="button" id="openCart"><span><span class="cnt num" id="cartN">0</span><span id="cartL">Ver pedido</span></span><span class="num" id="cartT">0$</span></button></div>
<div id="layer"></div>
<div class="toast" id="toast" hidden role="status"></div>

  b.querySelectorAll(".chip").forEach(function(c){c.onclick=function(){var g=groups.filter(function(x){return x.k===c.dataset.g;})[0];if(g.multi){var a=sel[g.k],i=a.indexOf(c.dataset.v);i>-1?a.splice(i,1):a.push(c.dataset.v);}else{sel[g.k]=c.dataset.v;}note=b.querySelector("#note").value;openSheet&&openSheet.rerender();};});
  b.querySelectorAll("[data-q]").forEach(function(q){q.onclick=function(){qty=Math.max(1,qty+ +q.dataset.q);note=b.querySelector("#note").value;openSheet.rerender();};});
  b.querySelector("#addBtn").onclick=function(){
   note=b.querySelector("#note").value.trim();
   var labels=[];groups.forEach(function(g){var v=sel[g.k];(Array.isArray(v)?v:(v?[v]:[])).forEach(function(x){var c=g.c.filter(function(cc){return cc[0]===x;})[0];labels.push(c[1]);});});
   S.cart.push({id:id,qty:qty,unit:m.p+extra,opts:labels,note:note});
   closeSheet();render();toast("✓ "+nm(m));
  };
 });
}
/* re-render helper: guarda a função de corpo da última folha */
(function(){var orig=sheet;sheet=function(t,fn,o){orig(t,fn,o);openSheet.rerender=function(){var sc=openSheet.el.querySelector(".sheet"),y=sc.scrollTop;fn(openSheet.body);sc.scrollTop=y;};};})();

function cartSheet(){
 var l=L();
 sheet(l.yourOrder,function(b){

   '<div class="total"><span>'+esc(l.total)+'</span><span class="num">'+money(cartTotal())+'</span></div>'+
   '<p class="hint">'+esc(l.minH)+'</p>'+
   '<label class="opt"><h4>'+esc(l.name)+'</h4><input type="text" id="gname" maxlength="24" placeholder="'+esc(l.nameP)+'" value="'+esc(S.guest)+'" autocomplete="given-name"></label>'+
   '<button type="button" class="primary" id="sendBtn"><span>'+esc(l.send)+'</span><span>→</span></button>';
  b.querySelectorAll("[data-rm]").forEach(function(x){x.onclick=function(){S.cart.splice(+x.dataset.rm,1);render();openSheet&&openSheet.rerender();if(!S.cart.length)closeSheet();};});
  b.querySelector("#sendBtn").onclick=function(){
   var name=b.querySelector("#gname").value.trim()||(l.mesa+" "+MESA);S.guest=name;ls("guest",name);
   var batch=Date.now().toString(36),now=Date.now(),btn=this;btn.disabled=true;
   var groups={};S.cart.forEach(function(c){var st=BY[c.id].st;(groups[st]=groups[st]||[]).push({id:c.id,name:BY[c.id].n.pt,qty:c.qty,opts:c.opts,note:c.note,unit:c.unit});});
   var ps=Object.keys(groups).map(function(st){var its=groups[st];return store.addOrder({mesa:MESA,guest:name,gid:S.gid,station:st,items:its,total:its.reduce(function(a,c){return a+c.unit*c.qty;},0),status:"novo",batch:batch,createdAt:now,updatedAt:now});});
   Promise.all(ps).then(function(){S.cart=[];closeSheet();render();toast("✓ "+l.sent);window.scrollTo({top:0,behavior:"smooth"});}).catch(function(){btn.disabled=false;toast("Não foi possível enviar. Tenta de novo.");});
  };
 });

/* ---------- Assistente ---------- */
function menuForAI(){return MENU.filter(function(m){return !soldOut(m.id);}).map(function(m){return {id:m.id,categoria:m.cat,nome:m.n.pt,nome_en:m.n.en,preco:m.p,descricao:m.d?m.d.pt:"",ingredientes:m.ing?m.ing.pt:"",alergenios:m.al,kcal_aprox:m.kcal,tempo_min:m.min,tag:m.tag,destino:m.st};});}
function asstSheet(prefill){
 var l=L();
 sheet(l.asst,function(b){
  var h='<div class="chat">'+(S.chat.length?"":'<div class="msg ai">'+esc(l.asstHi)+'</div><div class="sugg">'+l.sugg.map(function(s){return '<button type="button" class="chip" data-s="'+esc(s)+'">'+esc(s)+'</button>';}).join("")+'</div>');
  S.chat.forEach(function(m){if(m.role==="user"){h+='<div class="msg me">'+esc(m.content)+'</div>';}else{h+='<div class="msg ai">'+esc(m.reply)+'</div>';if(m.items&&m.items.length){h+='<div class="recs">'+m.items.filter(function(id){return BY[id];}).map(function(id){var it=BY[id];return '<button type="button" class="rec" data-item="'+id+'"><span><b>'+esc(nm(it))+'</b><br><span class="muted" style="font-size:13px">'+(it.kcal?"≈ "+it.kcal+" kcal · ":"")+esc(CATS.filter(function(c){return c.id===it.cat;})[0].n[S.lang])+'</span></span><span class="num">'+money(it.p)+' ›</span></button>';}).join("")+'</div>';}}});
  if(S.busy)h+='<div class="msg ai dots">'+(S.lang==="pt"?"A pensar":"…")+'</div>';
  h+='</div><form class="composer" id="cf"><input type="text" id="q" placeholder="'+esc(l.asstP)+'" autocomplete="off" aria-label="'+esc(l.asstP)+'"><button type="submit">→</button></form>';
  b.innerHTML=h;
  b.querySelectorAll("[data-s]").forEach(function(c){c.onclick=function(){ask(c.dataset.s);};});
  b.querySelectorAll(".rec").forEach(function(r){r.onclick=function(){dishSheet(r.dataset.item);};});
  b.querySelector("#cf").onsubmit=function(e){e.preventDefault();var v=b.querySelector("#q").value.trim();if(v)ask(v);};
  var sc=openSheet&&openSheet.el.querySelector(".sheet");if(sc)sc.scrollTop=sc.scrollHeight;
 });
 if(prefill)ask(prefill);
}
function ask(q){
 if(S.busy)return;
 if(!sample){S.chat.push({role:"user",content:q},{role:"assistant",reply:L().asstOff,items:[]});openSheet&&openSheet.rerender();return;}
 S.chat.push({role:"user",content:q});S.busy=true;openSheet&&openSheet.rerender();
 var langName={pt:"português europeu",en:"English",fr:"français",de:"Deutsch"}[S.lang];
 var sys="És o assistente do restaurante Quintal da Música (Praia, Cabo Verde), dentro do Menu Real. Ajudas o cliente a escolher pratos e bebidas.\n"+
  "Regras: usa APENAS os itens do MENU abaixo; nunca inventes pratos, preços, ingredientes ou disponibilidade. As calorias são aproximadas: diz isso quando falares delas. Se houver alergia, avisa que a informação deve ser confirmada com o empregado. Sê breve e simpático (máx. 3 frases). Sugere no máximo 3 itens, com ids exatos. Responde em "+langName+". Consumo mínimo: 1500$ por pessoa.\n"+
  "Responde só com JSON: {\"reply\": string, \"items\": [ids]}\nMENU: "+JSON.stringify(menuForAI());
 var msgs=[{role:"user",content:sys+"\n\nPergunta do cliente: "+S.chat[0].content}];
 var hist=S.chat.slice(1,-1);
 if(S.chat.length>1){msgs=[{role:"user",content:sys+"\n\nPergunta do cliente: "+S.chat[0].content}];
  for(var i=1;i<S.chat.length;i++){var m=S.chat[i];msgs.push(m.role==="user"?{role:"user",content:m.content}:{role:"assistant",content:JSON.stringify({reply:m.reply,items:m.items})});}}
 sample.json(msgs,{modelTier:"quick",cache:false}).then(function(r){
  var reply=r&&typeof r.reply==="string"?r.reply:"";var items=r&&Array.isArray(r.items)?r.items.filter(function(id){return BY[id];}).slice(0,3):[];
  S.chat.push({role:"assistant",reply:reply||L().asstErr,items:items});
 }).catch(function(e){S.chat.push({role:"assistant",reply:e&&e.code==="not_granted"?L().asstOff:L().asstErr,items:[]});})
 .then(function(){S.busy=false;openSheet&&openSheet.rerender&&openSheet.rerender();});
 void hist;
}

/* ---------- Cozinha ---------- */
function renderKitchen(){
 var st=S.kstation;
 var list=S.orders.filter(function(o){return o.status!=="entregue"&&(st==="todos"||o.station===st);});
 var reqs=S.requests.filter(function(r){return !r.done;});
 var cols=[["novo","Novos","Aceitar e preparar"],["preparo","Em preparo","Marcar como pronto"],["pronto","Prontos","Marcar como entregue"]];
 var h='<div class="view"><div class="kitchen"><div class="k-head"><h1>Pedidos em tempo real</h1><div class="seg" role="group" aria-label="Posto">'+[["todos","Tudo"],["cozinha","Cozinha"],["bar","Bar"]].map(function(x){return '<button type="button" data-st="'+x[0]+'" aria-pressed="'+(st===x[0])+'">'+x[1]+'</button>';}).join("")+'</div></div>';
 if(reqs.length)h+='<div class="alerts">'+reqs.map(function(r){return '<div class="alert"><span>🧾 Mesa '+esc(r.mesa)+' pediu a conta · '+esc(r.guest||"")+' · <span class="num">'+money(r.total||0)+'</span></span><button type="button" class="ghost" data-req="'+r.id+'">Feito</button></div>';}).join("")+'</div>';
 h+='<div class="board">'+cols.map(function(c){var os=list.filter(function(o){return o.status===c[0];}).sort(function(a,b){return a.createdAt-b.createdAt;});return '<section class="col"><div class="col-h"><span>'+c[1]+'</span><span class="num">'+os.length+'</span></div>'+(os.length?os.map(function(o){return '<article class="ord"><div class="ord-h"><b>Mesa '+esc(o.mesa)+'</b><span class="station">'+(o.station==="bar"?"Bar":"Cozinha")+'</span></div><div class="who num">'+esc(o.guest)+' · '+ago(o.createdAt)+'</div><ul>'+o.items.map(function(it){return '<li><b class="num">'+it.qty+'×</b> '+esc(it.name)+((it.opts&&it.opts.length)||it.note?'<small>'+esc((it.opts||[]).join(" · "))+(it.note?(it.opts&&it.opts.length?" · ":"")+"“"+esc(it.note)+"”":"")+'</small>':'')+'</li>';}).join("")+'</ul><button type="button" class="adv" data-adv="'+o.id+'" data-next="'+ST_ORDER[ST_ORDER.indexOf(o.status)+1]+'">'+c[2]+'</button></article>';}).join(""):'<p class="empty">Sem pedidos.</p>')+'</section>';}).join("")+'</div>';
 h+='<p class="banner">'+(db?"Ligado: os pedidos de todos os telemóveis aparecem aqui.":"Modo local: só aparecem os pedidos feitos neste ecrã.")+'</p></div></div>';
 app.innerHTML=h;
}
/* ---------- Gestão ---------- */
function renderManage(){
 var h='<div class="view"><div class="manage"><div><h1 style="font-size:22px;font-weight:700">Fotos e disponibilidade</h1><p class="muted" style="margin-top:4px">Tira a foto do prato tal como sai da cozinha. Aparece logo no menu de todas as mesas.</p></div>';
 if(!assets)h+='<p class="hint">Para carregar fotos é preciso ter acesso de edição a esta página.</p>';
 CATS.forEach(function(c){var items=MENU.filter(function(m){return m.cat===c.id;});h+='<h2 style="font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px">'+esc(c.n.pt)+'</h2>'+items.map(function(m){var so=soldOut(m.id);return '<div class="mrow"><span class="thumb">'+thumbHtml(m)+'</span><div style="min-width:0"><b>'+esc(m.n.pt)+'</b><div class="muted num" style="font-size:13px">'+money(m.p)+'</div></div><div class="acts">'+(assets?'<label class="ghost" for="f-'+m.id+'">📷 '+(photo(m.id)?"Trocar":"Foto")+'</label><input type="file" id="f-'+m.id+'" data-photo="'+m.id+'" accept="image/*" capture="environment" hidden>':'')+'<button type="button" class="sw" data-sold="'+m.id+'" aria-pressed="'+so+'">'+(so?"Esgotado":"Disponível")+'</button></div></div>';}).join("");});
 h+='</div></div>';app.innerHTML=h;
}
function shrink(file){return new Promise(function(res){var img=new Image(),u=URL.createObjectURL(file);img.onload=function(){var s=Math.min(1,1400/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(function(b){res(b||file);},"image/jpeg",.85);};img.onerror=function(){res(file);};img.src=u;});}

/* ---------- Eventos ---------- */
document.addEventListener("click",function(e){
 var t;
 if((t=e.target.closest(".seg button[data-view]"))){S.view=t.dataset.view;closeSheet(true);render();window.scrollTo(0,0);return;}
 if(openSheet&&openSheet.el.contains(e.target))return;
 if((t=e.target.closest("[data-lang]"))){S.lang=t.dataset.lang;ls("lang",S.lang);render();return;}
 if((t=e.target.closest("[data-cat]"))){S.cat=t.dataset.cat;var s=document.getElementById("cat-"+S.cat);document.querySelectorAll("[data-cat]").forEach(function(b){b.setAttribute("aria-pressed",String(b.dataset.cat===S.cat));});if(s)s.scrollIntoView({behavior:"smooth",block:"start"});return;}
 if((t=e.target.closest("[data-item]"))){dishSheet(t.dataset.item);return;}
 if(e.target.closest("#askBtn")){asstSheet();return;}
 if(e.target.closest("#openCart")){cartSheet();return;}
 if(e.target.closest("#billBtn")){var mine=S.orders.filter(function(o){return o.gid===S.gid;});store.addRequest({mesa:MESA,guest:S.guest,gid:S.gid,type:"conta",total:mine.reduce(function(a,o){return a+(o.total||0);},0),done:false,createdAt:Date.now()}).then(function(){toast("✓ "+L().billOk);});return;}
 if((t=e.target.closest("[data-st]"))){S.kstation=t.dataset.st;render();return;}
 if((t=e.target.closest("[data-adv]"))){t.disabled=true;store.setStatus(t.dataset.adv,t.dataset.next).catch(function(){t.disabled=false;toast("Não foi possível atualizar.");});return;}
 if((t=e.target.closest("[data-req]"))){store.doneRequest(t.dataset.req);return;}
 if((t=e.target.closest("[data-sold]"))){var id=t.dataset.sold;store.setItem(id,{soldOut:!soldOut(id)}).catch(function(){toast("Sem permissão para alterar.");});return;}
});
document.addEventListener("change",function(e){
 var inp=e.target.closest("[data-photo]");if(!inp||!inp.files||!inp.files[0]||!assets)return;
 var id=inp.dataset.photo;toast("A carregar foto…");
 shrink(inp.files[0]).then(function(b){return assets.upload(b,{type:"image/jpeg"});}).then(function(r){return store.setItem(id,{photoUrl:r.url,assetId:r.id});}).then(function(){toast("✓ Foto publicada no menu");}).catch(function(err){toast(err&&err.code==="too_large"?"Foto demasiado grande.":"Não foi possível carregar a foto.");});
});
var io=null;
function watchCats(){if(!("IntersectionObserver" in window))return;if(io)io.disconnect();io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){var id=en.target.id.replace("cat-","");if(S.cat!==id){S.cat=id;document.querySelectorAll("[data-cat]").forEach(function(b){var on=b.dataset.cat===id;b.setAttribute("aria-pressed",String(on));if(on&&b.scrollIntoView)b.parentNode.scrollTo({left:b.offsetLeft-16,behavior:"smooth"});});}}});},{rootMargin:"-130px 0px -65% 0px"});document.querySelectorAll(".sec").forEach(function(s){io.observe(s);});}
var _render=render;render=function(){_render();if(S.view==="client")watchCats();};
setInterval(function(){if(S.view==="kitchen"&&!openSheet)render();},30000);

/* ---------- Arranque ---------- */
render();
if(window.claude&&window.claude.use){
 window.claude.use("db").then(function(d){if(d){db=d;subscribe();render();}});
 window.claude.use("sample").then(function(s){sample=s;});
 window.claude.use("assets").then(function(a){assets=a;if(S.view==="manage")render();});
}
})();
