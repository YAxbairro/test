<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<title>Conecta Diáspora Teaser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600;700;800&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{--blue:#0B2C9E;--blue-deep:#06175E;--blue-mid:#1446C8;--sky:#3D8BF0;--lime:#E6F53B;--cream:#F6EFDF}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
  #stage{position:absolute;inset:0;overflow:hidden;background:var(--blue-deep);font-family:Montserrat,sans-serif;color:var(--cream)}
  .layer{position:absolute;inset:0;overflow:hidden}
  .anton{font-family:Anton,Impact,sans-serif;text-transform:uppercase;line-height:1;white-space:nowrap}
  .ch{display:inline-block}
  .kick{font-weight:700;letter-spacing:.42em;text-transform:uppercase;font-size:34px}

  /* A — cities */
  #sA{background:var(--blue)}
  .city{position:absolute;inset:0;visibility:hidden}
  .city .name{position:absolute;left:50%;top:50%;font-size:330px}
  .city .de{position:absolute;left:0;right:0;text-align:center;top:640px}
  .city .idx{position:absolute;left:70px;bottom:120px;font-weight:800;font-size:30px;letter-spacing:.3em}
  #lineA,#islandsG{position:absolute;inset:0}
  #cv{position:absolute;left:0;right:0;top:1330px;text-align:center;font-size:190px;color:var(--lime);overflow:hidden;padding-top:40px}
  #cvA{position:absolute;left:0;right:0;top:1290px;text-align:center}

  /* B — sunrise */
  #sB{background:var(--cream)}
  #sun{position:absolute;left:540px;top:1080px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:var(--lime)}
  #tagB{position:absolute;left:0;right:0;top:330px;text-align:center;color:var(--blue)}

  /* C — words on lime */
  #sC{background:var(--lime);color:var(--blue)}
  .wd{position:absolute;left:50%;top:50%;visibility:hidden;color:var(--blue)}
  #thread{position:absolute;left:0;top:952px;height:16px;width:1080px;background:var(--blue);transform-origin:left center;transform:scaleX(0)}
  #ringC{position:absolute;left:540px;top:960px;width:1300px;height:1300px;margin:-650px 0 0 -650px;border-radius:50%;border:4px dashed rgba(11,44,158,.3)}

  /* D — tunnel */
  #sD{background:radial-gradient(circle at 50% 50%, var(--blue-mid) 0%, var(--blue) 40%, var(--blue-deep) 100%)}
  #tunnel{position:absolute;inset:0}
  .tr{position:absolute;left:540px;top:960px;width:600px;height:600px;margin:-300px 0 0 -300px;border-radius:50%;border-style:solid;transform:scale(0)}
  .fly{position:absolute;left:50%;top:50%;visibility:hidden;color:var(--cream)}

  /* E — lockup */
  #sE{background:radial-gradient(90% 60% at 50% 48%, var(--blue-mid) 0%, var(--blue) 45%, var(--blue-deep) 100%)}
  #y2027{position:absolute;left:50%;top:50%;font-size:600px;color:transparent;-webkit-text-stroke:3px rgba(61,139,240,.55)}
  #lock{position:absolute;left:0;right:0;top:640px;text-align:center}
  #lock .l{display:block;font-size:250px;line-height:.98;padding-top:50px;margin-top:-50px;overflow:hidden}
  #lC{color:var(--cream)} #lD{color:var(--lime)}
  #lbar{width:160px;height:10px;background:var(--lime);margin:44px auto 0;transform:scaleX(0)}
  #ldate{margin-top:40px;font-weight:800;font-size:38px;letter-spacing:.32em;color:var(--cream)}
  #sheen{position:absolute;left:0;top:560px;width:380px;height:700px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);mix-blend-mode:overlay;transform:skewX(-20deg) translateX(-600px)}

  #flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  #grain{position:absolute;inset:-200px;opacity:.08;pointer-events:none;mix-blend-mode:overlay;background-size:256px 256px}
  #vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(130% 90% at 50% 50%, transparent 60%, rgba(0,0,25,.4) 100%)}
</style>
</head>
<body>
<div id="stage"><div id="cam" class="layer">

  <!-- A: cities flash, one thread runs through them, lands in Cabo Verde -->
  <div id="sA" class="layer">
    <div class="city" id="c1" style="background:var(--blue)"><div class="de kick">de</div><div class="name anton" style="color:var(--cream)">Lisboa</div><div class="idx">38.7° N</div></div>
    <div class="city" id="c2" style="background:var(--cream)"><div class="de kick" style="color:var(--blue)">de</div><div class="name anton" style="color:var(--blue)">Boston</div><div class="idx" style="color:var(--blue)">42.3° N</div></div>
    <div class="city" id="c3" style="background:var(--lime)"><div class="de kick" style="color:var(--blue)">de</div><div class="name anton" style="color:var(--blue)">Paris</div><div class="idx" style="color:var(--blue)">48.8° N</div></div>
    <div class="city" id="c4" style="background:var(--blue-deep)"><div class="de kick">de</div><div class="name anton" style="font-size:250px;color:transparent;-webkit-text-stroke:4px var(--cream)">Roterdão</div><div class="idx">51.9° N</div></div>
    <svg id="islandsG" viewBox="0 0 1080 1920"><g id="isl"></g></svg>
    <div id="cvA" class="kick" style="opacity:0">a</div>
    <div id="cv" class="anton"></div>
    <svg id="lineA" viewBox="0 0 1080 1920"><path id="thr" d="M-60 1500 C 180 1300, 320 1640, 560 1460 S 980 1180, 940 1000 S 700 760, 540 960" fill="none" stroke="#E6F53B" stroke-width="12" stroke-linecap="round"/><circle id="tip" r="20" fill="#E6F53B"/></svg>
  </div>

  <!-- B: island → sunrise over the sea -->
  <div id="sB" class="layer" style="visibility:hidden">
    <div id="tagB" class="kick">Da diáspora a Cabo Verde</div>
    <div id="sun"></div>
    <svg class="layer" viewBox="0 0 1080 1920" id="land">
      <path d="M0 1920 L0 1180 C110 1150 170 1060 260 1040 C340 1020 380 1100 460 1090 C560 1075 600 960 700 950 C790 942 840 1060 930 1070 C1000 1078 1040 1050 1080 1060 L1080 1920Z" fill="#1446C8"/>
      <path d="M0 1920 L0 1240 C150 1225 240 1170 360 1180 C470 1190 560 1250 680 1240 C820 1228 900 1170 1080 1185 L1080 1920Z" fill="#0B2C9E"/>
      <g id="sea" fill="none" stroke="#3D8BF0" stroke-width="3" opacity=".7"></g>
    </svg>
  </div>

  <!-- C: kinetic words -->
  <div id="sC" class="layer" style="visibility:hidden">
    <div id="ringC"></div>
    <div class="wd anton" id="k1" style="font-size:330px">Ideias</div>
    <div class="wd anton" id="k2" style="font-size:560px">Que</div>
    <div class="wd anton" id="k3" style="font-size:560px">Nos</div>
    <div class="wd anton" id="k4" style="font-size:390px"></div>
    <div id="thread"></div>
  </div>

  <!-- D: tunnel -->
  <div id="sD" class="layer" style="visibility:hidden">
    <div id="tunnel"></div>
    <div class="fly anton" id="f1" style="font-size:190px">Empreender</div>
    <div class="fly anton" id="f2" style="font-size:210px;color:var(--lime)">Partilhar</div>
    <div class="fly anton" id="f3" style="font-size:210px">Conectar</div>
    <div class="fly anton" id="f4" style="font-size:300px;color:var(--lime)">Jovens</div>
    <div class="fly anton" id="f5" style="font-size:150px">Cabo-verdianos</div>
  </div>

  <!-- E: lockup -->
  <div id="sE" class="layer" style="visibility:hidden">
    <svg class="layer" viewBox="0 0 1080 1920" id="threadsE" fill="none" stroke-linecap="round"></svg>
    <div id="y2027" class="anton">2027</div>
    <div id="lock">
      <span class="l anton" id="lC"></span>
      <span class="l anton" id="lD"></span>
      <div id="lbar"></div>
      <div id="ldate">Janeiro 2027 · Cabo Verde</div>
    </div>
    <div id="sheen"></div>
  </div>

</div>
<div id="vig"></div><div id="grain"></div><div id="flash"></div>
</div>

<script>
const B0=0.26,BEAT=0.5,b=n=>B0+n*BEAT;   // 120 BPM, first kick at 0.26s
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const NS='http://www.w3.org/2000/svg';
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const split=(sel,txt)=>{const e=$(sel);e.innerHTML=[...txt].map(c=>`<span class="ch">${c===' '?'&nbsp;':c}</span>`).join('');return e.querySelectorAll('.ch')};

// grain
(()=>{const c=document.createElement('canvas');c.width=c.height=256;const x=c.getContext('2d'),im=x.createImageData(256,256);let s=7;
 for(let i=0;i<im.data.length;i+=4){s=(s*16807)%2147483647;im.data[i]=im.data[i+1]=im.data[i+2]=s%255;im.data[i+3]=255}
 x.putImageData(im,0,0);$('#grain').style.backgroundImage=`url(${c.toDataURL()})`})();

// Cape Verde islands, Santiago centred at (540,960)
const ISL=[['SA',-25.17,17.07,34,22,-20],['SV',-24.96,16.84,15,10,10],['SL',-24.75,16.76,7,4,0],['SN',-24.27,16.60,30,9,-12],['SAL',-22.93,16.73,8,17,0],
 ['BV',-22.82,16.10,22,20,0],['MA',-23.17,15.22,11,14,0],['ST',-23.62,15.08,19,32,-15],['FO',-24.38,14.93,15,15,0],['BR',-24.71,14.85,6,6,0]];
function blob(g,cx,cy,rx,ry,rot,fill,seed){const n=14,pts=[];let s=seed*9301+49297;
 for(let i=0;i<n;i++){s=(s*9301+49297)%233280;const r=.78+.32*(s/233280),a=i/n*Math.PI*2;pts.push([Math.cos(a)*rx*r,Math.sin(a)*ry*r])}
 const m=(p,q)=>[(p[0]+q[0])/2,(p[1]+q[1])/2];let d=`M${m(pts[n-1],pts[0])}`;for(let i=0;i<n;i++){const q=m(pts[i],pts[(i+1)%n]);d+=`Q${pts[i]} ${q}`}
 return mk('path',{d:d+'Z',fill,transform:`translate(${cx} ${cy}) rotate(${rot})`},g)}
const isl=$('#isl');ISL.forEach((v,i)=>{const x=540+(v[1]+23.62)*300,y=960-(v[2]-15.08)*300;
 const g=mk('g',{class:'is'},isl);blob(g,x,y,v[3]*3,v[4]*3,v[5],'#F6EFDF',i+3)});

// sea lines
const sea=$('#sea');for(let i=0;i<10;i++){const y=1330+i*52;let d=`M-40 ${y}`;for(let x=-40;x<1120;x+=60)d+=` q30 ${i%2?-12:12} 60 0`;mk('path',{d,class:'sw'},sea)}

// tunnel rings
const tun=$('#tunnel');const RC=['#E6F53B','#F6EFDF','#3D8BF0','#F6EFDF'];
for(let i=0;i<10;i++){const r=document.createElement('div');r.className='tr';r.style.borderColor=RC[i%4];r.style.borderWidth=(i%4===0?26:i%2?6:14)+'px';tun.appendChild(r)}

// converging threads for the end
const thE=$('#threadsE');[[-50,200],[1130,320],[-50,1700],[1130,1600],[540,-60],[540,1980]].forEach(([x,y],i)=>{
 const cx=(x+540)/2+(i%2?-260:260),cy=(y+960)/2;mk('path',{d:`M${x} ${y} Q${cx} ${cy} 540 960`,stroke:i%3===0?'#E6F53B':'rgba(246,239,223,.55)','stroke-width':i%3===0?6:3,class:'te'},thE)});

const cvCh=split('#cv','Cabo Verde');const k4Ch=split('#k4','Ligam');
const lC=split('#lC','Conecta'),lD=split('#lD','Diáspora');

$$('#thr,.te,.sw').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L});

const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
const _ft=tl.fromTo.bind(tl);tl.fromTo=(t,a,v,p)=>_ft(t,a,Object.assign({immediateRender:false},v),p);
const punch=(t,x=0,y=-16,s=1)=>tl.fromTo('#cam',{x,y,scale:s},{x:0,y:0,scale:1,duration:.4,ease:'elastic.out(1,.35)'},t);
const show=(sel,t)=>tl.set(sel,{visibility:'visible'},t), hide=(sel,t)=>tl.set(sel,{visibility:'hidden'},t);

function build(){
// ---------- A: 0 → b7  (cities, thread, landing)
const thr=$('#thr'),L=thr.getTotalLength(),tip=$('#tip');const tipObj={p:0};
gsap.set('.is',{scale:0,transformOrigin:'50% 50%',transformBox:'fill-box'});gsap.set(cvCh,{yPercent:110,opacity:0});
$$('.city .name').forEach(n=>gsap.set(n,{xPercent:-50,yPercent:-50}));
const moveTip=()=>{const pt=thr.getPointAtLength(tipObj.p*L);tip.setAttribute('cx',pt.x);tip.setAttribute('cy',pt.y);thr.style.strokeDashoffset=L*(1-tipObj.p)};
moveTip();
tl.to(tipObj,{p:1,duration:b(4),ease:'none',onUpdate:moveTip},0);
['#c1','#c2','#c3','#c4'].forEach((c,i)=>{const t=i===0?0:b(i);show(c,t);if(i)hide(['#c1','#c2','#c3'][i-1],t);
  tl.fromTo(`${c} .name`,{scale:1.35,x:i%2?-120:120,filter:'blur(10px)'},{scale:1,x:i%2?40:-40,filter:'blur(0px)',duration:.5,ease:'expo.out'},t)
    .fromTo(`${c} .de`,{opacity:0,y:30},{opacity:1,y:0,duration:.3},t+.05);
  if(i)punch(t,i%2?18:-18,0,1.03);});
// line colour vs. backgrounds
tl.set('#thr',{attr:{stroke:'#0B2C9E'}},b(1)).set('#tip',{attr:{fill:'#0B2C9E'}},b(1))
  .set('#thr',{attr:{stroke:'#E6F53B'}},b(3)).set('#tip',{attr:{fill:'#E6F53B'}},b(3));
// b4 BIG HIT: thread lands → islands burst, CABO VERDE
hide('#c4',b(4));
tl.fromTo('#flash',{opacity:.7},{opacity:0,duration:.4},b(4));punch(b(4),0,-30,1.06);
tl.to('#lineA',{opacity:0,duration:.25},b(4)+.1)
  .to('.is',{scale:1,duration:.8,stagger:{each:.035,from:7},ease:'back.out(2.2)'},b(4))
  .to('#cvA',{opacity:1,duration:.3},b(4)+.1)
  .to(cvCh,{yPercent:0,opacity:1,stagger:.03,duration:.5,ease:'expo.out'},b(4)+.1)
  .fromTo('#islandsG',{rotation:-6,scale:1.15},{rotation:3,scale:.95,duration:1.6,ease:'power1.inOut',transformOrigin:'540px 960px'},b(4))
// MATCH CUT: dive into Santiago → its cream fills the frame
  .to(['#cv','#cvA'],{opacity:0,y:60,duration:.3,ease:'power2.in'},b(6)+.1)
  .fromTo('#islandsG',{scale:.95,rotation:3},{scale:40,rotation:0,duration:.5,ease:'expo.in',transformOrigin:'540px 960px'},b(7)-.48);
show('#sB',b(7));hide('#sA',b(7));

// ---------- B: b7 → b11  sunrise
gsap.set('#sun',{y:520});gsap.set('#land',{y:700});gsap.set('#tagB',{opacity:0,letterSpacing:'.9em'});
tl.to('#land',{y:0,duration:.9,ease:'expo.out'},b(7))
  .to('#sun',{y:0,duration:1.3,ease:'expo.out'},b(7)+.15)
  .to('.sw',{strokeDashoffset:0,duration:1,stagger:.04,ease:'power2.out'},b(7)+.2)
  .to('#tagB',{opacity:1,letterSpacing:'.32em',duration:1,ease:'expo.out'},b(8))
  .fromTo('#sun',{scale:1},{scale:1.08,duration:.25,yoyo:true,repeat:1,ease:'sine.inOut'},b(9))
// push into the sun → lime
  .to('#sB',{scale:16,duration:.55,ease:'expo.in',transformOrigin:'540px 1080px'},b(10)-.05)
  .to('#tagB',{opacity:0,duration:.2},b(10));
show('#sC',b(11));hide('#sB',b(11));

// ---------- C: b11 → b15  IDEIAS QUE NOS LIGAM
const words=[['#k1',b(11),-4],['#k2',b(12),3],['#k3',b(12)+.25,-3],['#k4',b(13),0]];
words.forEach(([w,t,r],i)=>{show(w,t);if(i)hide(words[i-1][0],t);
  tl.fromTo(w,{xPercent:-50,yPercent:-52,scale:1.5,rotation:r*2,filter:'blur(16px)'},{xPercent:-50,yPercent:-52,scale:1,rotation:r,filter:'blur(0px)',duration:.4,ease:'expo.out'},t);
  punch(t,i%2?14:-14,-10,1.02);});
tl.fromTo('#ringC',{scale:.6,rotation:0},{scale:1.1,rotation:90,duration:2,ease:'none'},b(11))
// the thread passes through LIGAM, letters scatter, thread opens up into the next world
  .to('#thread',{scaleX:1,duration:.35,ease:'expo.out'},b(14))
  .to(k4Ch,{y:i=>i%2?-900:900,rotation:i=>(i%2?-1:1)*25,opacity:0,duration:.45,stagger:.03,ease:'power3.in'},b(14)+.05)
  .to('#thread',{scaleY:130,duration:.4,ease:'expo.in'},b(14)+.12);
show('#sD',b(15));hide('#sC',b(15));

// ---------- D: b15 → b20  tunnel
$$('.tr').forEach((r,i)=>{tl.fromTo(r,{scale:.02,opacity:0},{scale:5,opacity:1,duration:1.4,ease:'power2.in',repeat:3},b(15)-1.4+i*.14)});
const flys=['#f1','#f2','#f3','#f4','#f5'],ft=[b(15),b(16),b(17),b(18),b(18)+.25];
flys.forEach((f,i)=>{const t=ft[i],end=ft[i+1]||b(19);show(f,t);
  tl.fromTo(f,{xPercent:-50,yPercent:-50,scale:.15,opacity:0,filter:'blur(6px)'},{xPercent:-50,yPercent:-50,scale:1,opacity:1,filter:'blur(0px)',duration:.22,ease:'expo.out'},t)
    .to(f,{scale:1.12,duration:Math.max(.05,end-t-.34),ease:'none'},t+.22)
    .to(f,{scale:7,opacity:0,filter:'blur(14px)',duration:.18,ease:'power2.in'},end-.1);hide(f,end+.1);
  punch(t,0,0,1.03);});
tl.fromTo('#tunnel',{rotation:0},{rotation:40,duration:2.5,ease:'power1.in'},b(15))
  .fromTo('#flash',{opacity:0},{opacity:1,duration:.35,ease:'expo.in'},b(20)-.35);
show('#sE',b(20));hide('#sD',b(20));

// ---------- E: b20 → 15s  lockup
gsap.set([...lC,...lD],{yPercent:110});gsap.set('#ldate',{opacity:0,letterSpacing:'.9em'});gsap.set('#y2027',{xPercent:-50,yPercent:-50,opacity:0});
tl.fromTo('#flash',{opacity:1},{opacity:0,duration:.6,ease:'power2.out'},b(20))
  .to('.te',{strokeDashoffset:0,duration:.9,stagger:.05,ease:'expo.out'},b(20))
  .to(lC,{yPercent:0,duration:.6,stagger:.04,ease:'expo.out'},b(20))
  .to(lD,{yPercent:0,duration:.6,stagger:.04,ease:'expo.out'},b(21))
  .to('#lbar',{scaleX:1,duration:.5,ease:'expo.out'},b(22))
  .to('#ldate',{opacity:1,letterSpacing:'.32em',duration:1,ease:'expo.out'},b(22)+.1)
  .fromTo('#y2027',{scale:1.5,opacity:0},{scale:1.05,opacity:1,duration:4.7,ease:'power2.out'},b(20))
  .fromTo('#sheen',{x:-600},{x:1500,duration:.9,ease:'power2.inOut'},b(23)+.2)
  .fromTo('#lock',{scale:1},{scale:1.04,duration:15-b(20),ease:'none'},b(20));
punch(b(20),0,0,1.08);punch(b(21),0,-20,1);
tl.to({},{duration:.01},15);
}

window.seek=t=>{tl.seek(t,false);const f=Math.floor(t*30);$('#grain').style.transform=`translate(${(f*73)%160-80}px,${(f*131)%160-80}px)`};
window.ready=(async()=>{await document.fonts.ready;await document.fonts.load('300px Anton');build();return true})();
if(!location.search.includes('render')){window.ready.then(()=>{const a=new Audio('audio/track.wav');let t0=null;
 document.body.addEventListener('click',()=>{a.currentTime=0;a.play();t0=performance.now()});
 (function loop(now){seek(t0?((now-t0)/1000)%15:0);requestAnimationFrame(loop)})(performance.now())})}
</script>
</body>
</html>
